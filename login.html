<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン連携画面</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .app-container { background-color: white; width: 100%; max-width: 450px; min-height: 500px; border-radius: 20px; padding: 20px; box-sizing: border-box; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .btn-back { color: #54bbf0; text-decoration: none; font-weight: bold; font-size: 14px; }
        .form-group { margin-bottom: 15px; margin-top: 15px; }
        .form-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
        .btn-submit { width: 100%; padding: 12px; background-color: #54bbf0; color: white; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="app-container">
        <a href="index.html" class="btn-back">← ホームに戻る</a>
        
        <h2>🔑 アカウント連携・ログイン</h2>
        
        <div style="background: #eef7ff; padding: 10px; font-size: 12px; color: #0056b3; border-radius: 6px;">
            <strong>テスト用入力データ:</strong><br>
            ユーザーID: <code>12345678</code><br>
            連携コード: <code>999888</code>
        </div>

        <div class="form-group">
            <label>Roblox ユーザーID（数字）</label>
            <input type="number" id="userId" placeholder="例: 12345678">
        </div>

        <div class="form-group">
            <label>マップ内発行コード（6桁）</label>
            <input type="text" id="authCode" placeholder="例: 999888">
        </div>

        <button class="btn-submit" onclick="doLogin()">検証してホームへ戻る</button>
    </div>

    <script>
        // テスト用アカウントデータ
        const testUsers = [
            { id: "12345678", code: "999888", name: "Player_A" },
            { id: "87654321", code: "111222", name: "Player_B" }
        ];

        function doLogin() {
            const idInput = document.getElementById('userId').value.trim();
            const codeInput = document.getElementById('authCode').value.trim();

            if (!idInput || !codeInput) {
                alert("IDとコードを入力してください。");
                return;
            }

            // データ照合
            const match = testUsers.find(u => u.id === idInput && u.code === codeInput);

            if (match) {
                alert("🎉 ログイン成功！ホーム画面に移動します。");
                
                // ブラウザにログイン情報を保存（ここがポイント！）
                localStorage.setItem('isLoggedIn', 'true');
                localStorage.setItem('username', match.name);
                localStorage.setItem('userId', match.id);

                // ホーム画面（index.html）へ移動
                window.location.href = 'index.html';
            } else {
                alert("❌ IDまたはコードが間違っています。");
            }
        }
    </script>
</body>
</html>
